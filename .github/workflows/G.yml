name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'نسخه اپ (مثل 1.0.0)'
        required: false
        type: string
        default: '1.0.0'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve project dir (root or gcb/)
        id: proj
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            D="$(dirname "$(find . -maxdepth 3 -name package-lock.json 2>/dev/null | head -1)")"
            echo "dir=${D:-.}" >> "$GITHUB_OUTPUT"
          fi
          echo "PROJECT_DIR=$D"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Accept Android SDK licenses (preinstalled SDK on runner)
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager 2>/dev/null | head -1)
          echo "using sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install JS deps
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm ci

      - name: Expo prebuild (android)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Set build version
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          cd android
          sed -i "s/versionName \"1\.0\.0\"/versionName \"$APP_VERSION\"/" app/build.gradle 2>/dev/null || true
        env:
          APP_VERSION: ${{ inputs.app_version || '1.0.0' }}

      - name: Prepare release keystore
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          KSTORE=android/app/release.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KSTORE"
          else
            keytool -genkeypair -v \
              -keystore "$KSTORE" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GCB, OU=GCB, O=GCB, L=Unknown, ST=Unknown, C=US"
          fi
          ls -la "$KSTORE"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'gcbrelease' }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'gcbrelease' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}

      - name: Wire signing into gradle + build release APK
        shell: bash
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          set -e
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'signingConfigs.release' not in s:
              s = s.replace('signingConfigs {', 'signingConfigs {', 1)
              idx = s.index('signingConfigs {') + len('signingConfigs {')
              block = """
                release {
                    storeFile file("release.keystore")
                    storePassword RELEASE_STORE_PASSWORD
                    keyAlias RELEASE_KEY_ALIAS
                    keyPassword RELEASE_KEY_PASSWORD
                }"""
              s = s[:idx] + block + s[idx:]
              s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              s = s.replace('apply plugin: "com.android.application"', 'apply plugin: "com.android.application"' + chr(10) +
                  'def RELEASE_STORE_PASSWORD = System.getenv("STORE_PASS") ?: "gcbrelease"' + chr(10) +
                  'def RELEASE_KEY_ALIAS = System.getenv("KEY_ALIAS") ?: "release"' + chr(10) +
                  'def RELEASE_KEY_PASSWORD = System.getenv("KEY_PASS") ?: "gcbrelease"', 1)
              open(p, 'w').write(s)
          print("build.gradle patched")
          PY
          cd android
          STORE_PASS="$STORE_PASS" KEY_ALIAS="$KEY_ALIAS" KEY_PASS="$KEY_PASS" ./gradlew assembleRelease --no-daemon
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'gcbrelease' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'gcbrelease' }}

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -la android/app/build/outputs/apk/release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.proj.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload release keystore artifact (SAVE THIS for future updates)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: ${{ steps.proj.outputs.dir }}/android/app/release.keystore
          if-no-files-found: warn

      - name: Create GitHub Release & attach APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.proj.outputs.dir }}/${{ steps.apk.outputs.path }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK_PATH" \
            --title "gemini-canvas-browser v${GITHUB_REF_NAME#v}" \
            --notes "مرورگر کانواس - release build" \
            || echo "Release creation skipped/failed (maybe exists)"
