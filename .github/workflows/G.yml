name: Build APK from Zip

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 دریافت مخزن
        uses: actions/checkout@v4

      - name: 📦 بررسی و استخراج فایل زیپ
        run: |
          ZIP_NAME="gcb-source (7).zip"
          if [ ! -f "$ZIP_NAME" ]; then
            echo "❌ خطا: فایل $ZIP_NAME در روت مخزن پیدا نشد!"
            ls -la
            exit 1
          fi

          echo "✅ فایل $ZIP_NAME پیدا شد. در حال استخراج..."
          mkdir -p temp_extract
          unzip -q -o "$ZIP_NAME" -d temp_extract

          # اگر فایل‌ها درون پوشه داخلی زیپ شده باشند، آن‌ها را به روت منتقل می‌کند
          if [ -f "temp_extract/package.json" ]; then
            cp -rf temp_extract/* .
          else
            INNER_DIR=$(find temp_extract -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$INNER_DIR" ]; then
              echo "📂 ساختار پوشه‌بندی شناسایی شد: $INNER_DIR"
              cp -rf "$INNER_DIR"/* .
            fi
          fi

          rm -rf temp_extract
          # حذف node_modules احتمالی سیستم قبلی جهت جلوگیری از تداخل معماری
          rm -rf node_modules

      - name: ☕ راه‌اندازی جاوا (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 نصب وابستگی‌ها
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: ⚙️ ایجاد پوشه نیتیو اندروید (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 تنظیم مجوز دسترسی به Gradle
        run: chmod +x android/gradlew

      - name: 🔨 کامپایل و ساخت APK
        run: |
          cd android
          # ابتدا بیلد Release را تست می‌کند و در صورت عدم تنظیم کی‌استور سراغ Debug می‌رود
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: 🔍 استخراج و نام‌گذاری فایل APK
        run: |
          # انتخاب فایل APK قابل نصب (دارای امضا)
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "❌ خطا: فایل APK تولید نشد!"
            exit 1
          fi

          echo "✅ فایل خروجی پیدا شد: $APK_FILE"
          cp "$APK_FILE" ./gemini-canvas-browser.apk

      - name: 📤 ذخیره APK در بخش Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemini-canvas-browser-apk
          path: ./gemini-canvas-browser.apk
          retention-days: 14
